markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.emoji
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search

docs_dir: docs/research/onboarding
site_dir: site/onboarding-research

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
