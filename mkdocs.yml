site_name: Onboarding Research — Sensitive Data Collection Analysis
site_description: 100+ company onboarding analysis — risk-vs-conversion tradeoffs, SWOT vs Intuit QuickBooks
repo_url: https://github.com/cicidi/deterministic-ai-agent
repo_name: cicidi/deterministic-ai-agent
edit_uri: edit/master/docs/research/onboarding/

theme:
  name: material
  palette:
    primary: indigo
    accent: deep orange
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.tracking
    - navigation.tabs.sticky
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

